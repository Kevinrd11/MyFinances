services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finanzaos
      POSTGRES_PASSWORD: finanzaos_local
      POSTGRES_DB: finanzaos
    ports:
      - "5432:5432"
    volumes:
      - finanzaos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finanzaos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finanzaos_postgres:
